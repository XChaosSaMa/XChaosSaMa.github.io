{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      <div class="post-meta">
        {{ .Date.Format "2006-01-02" }}
        {{ with .Params.author }} :: {{ . }}{{ end }}
      </div>
      {{ with .Params.tags }}
        <div class="post-tags">
          {{ range . }}
            <a href="/tags/{{ . | urlize }}">#{{ . }}</a>
          {{ end }}
        </div>
      {{ end }}
    </header>

    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
