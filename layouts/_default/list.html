{{ define "main" }}
  <div class="posts">
    {{ range .Pages }}
      <div class="post on-list">
        <h1 class="post-title">
          <a href="{{ .Permalink }}">{{ .Title }}</a>
        </h1>
        <div class="post-meta">
          {{ .Date.Format "2006-01-02" }}
        </div>
      </div>
    {{ end }}
  </div>
{{ end }}
